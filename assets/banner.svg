<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes waveBar1 {
        0%, 100% { height: 16px; y: 254px; }
        50% { height: 48px; y: 222px; }
      }
      @keyframes waveBar2 {
        0%, 100% { height: 38px; y: 232px; }
        50% { height: 18px; y: 252px; }
      }
      @keyframes waveBar3 {
        0%, 100% { height: 52px; y: 218px; }
        50% { height: 30px; y: 240px; }
      }
      @keyframes waveBar4 {
        0%, 100% { height: 24px; y: 246px; }
        50% { height: 60px; y: 210px; }
      }
      @keyframes waveBar5 {
        0%, 100% { height: 44px; y: 226px; }
        50% { height: 20px; y: 250px; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glow-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 1050px 240px;
        animation: pulseGlow 9s ease-in-out infinite reverse;
      }
      .pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .pill-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .pill-3 {
        animation: floatSlow 7s ease-in-out infinite 1s;
      }
      .bar-1 { animation: waveBar1 1.2s ease-in-out infinite; }
      .bar-2 { animation: waveBar2 1.5s ease-in-out infinite; }
      .bar-3 { animation: waveBar3 1.1s ease-in-out infinite; }
      .bar-4 { animation: waveBar4 1.4s ease-in-out infinite; }
      .bar-5 { animation: waveBar5 1.3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />

  <!-- Subtle Cyber Grid Lines -->
  <g stroke="#1a2744" stroke-width="1" opacity="0.4">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Dynamic Glowing Orbs (in Background) -->
  <circle class="glow-orb-1" cx="220" cy="110" r="140" fill="#00f2fe" opacity="0.18" filter="url(#glow)" />
  <circle class="glow-orb-2" cx="1020" cy="220" r="160" fill="#7f00ff" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="40" r="100" fill="#e94057" opacity="0.12" filter="url(#glow)" />

  <!-- Ambient Waveform Graphic (Audio Fingerprinting Symbolism) -->
  <g opacity="0.55">
    <rect class="bar-1" x="1000" y="254" width="6" height="16" rx="3" fill="#00f2fe" />
    <rect class="bar-2" x="1012" y="232" width="6" height="38" rx="3" fill="#38ef7d" />
    <rect class="bar-3" x="1024" y="218" width="6" height="52" rx="3" fill="#00f2fe" />
    <rect class="bar-4" x="1036" y="246" width="6" height="24" rx="3" fill="#7f00ff" />
    <rect class="bar-5" x="1048" y="226" width="6" height="44" rx="3" fill="#00f2fe" />
    <rect class="bar-2" x="1060" y="238" width="6" height="32" rx="3" fill="#e94057" />
    <rect class="bar-4" x="1072" y="220" width="6" height="50" rx="3" fill="#00f2fe" />
    <rect class="bar-1" x="1084" y="248" width="6" height="22" rx="3" fill="#38ef7d" />
  </g>

  <!-- Ambient Floating Status Badges (Background/Accents) -->
  <!-- Pill 1: Content ID -->
  <g class="pill-1" transform="translate(850, 42)">
    <rect width="180" height="32" rx="16" fill="#13233c" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4.5" fill="#00f2fe" filter="url(#soft-glow)" />
    <text x="32" y="20.5" fill="#b9e7fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CONTENT ID VERIFIED</text>
  </g>

  <!-- Pill 2: DRM Protection -->
  <g class="pill-2" transform="translate(90, 240)">
    <rect width="195" height="32" rx="16" fill="#1e1838" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4.5" fill="#a855f7" filter="url(#soft-glow)" />
    <text x="32" y="20.5" fill="#ebd4ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">DIGITAL RIGHTS &amp; DRM</text>
  </g>

  <!-- Pill 3: Audio Fingerprint -->
  <g class="pill-3" transform="translate(680, 260)">
    <rect width="215" height="32" rx="16" fill="#152b2b" stroke="#38ef7d" stroke-width="1.2" opacity="0.85" />
    <circle cx="18" cy="16" r="4.5" fill="#38ef7d" filter="url(#soft-glow)" />
    <text x="32" y="20.5" fill="#c2f9d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AUDIO FINGERPRINTING</text>
  </g>

  <!-- Security Shield & Lock Motif (Foreground Left) -->
  <g transform="translate(80, 75)" filter="url(#text-shadow)">
    <!-- Shield Base -->
    <path d="M45 10 L82 24 C82 62 45 92 45 92 C45 92 8 62 8 24 Z" fill="url(#shield-grad)" stroke="#ffffff" stroke-width="1.5" opacity="0.95" />
    <!-- Inner Lock Icon -->
    <rect x="34" y="47" width="22" height="18" rx="3" fill="#ffffff" />
    <path d="M39 47 V38 C39 34.5 42 32 45 32 C48 32 51 34.5 51 38 V47" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="45" cy="55" r="2" fill="#0b1329" />
  </g>

  <!-- Primary Foreground Content (Title, Subtitle, Tags) -->
  <g transform="translate(195, 95)" filter="url(#text-shadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="230" height="24" rx="12" fill="#00f2fe" fill-opacity="0.15" stroke="#00f2fe" stroke-width="1" />
      <text x="12" y="16" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">
      Awesome Copyright &amp; Content Protection
    </text>

    <!-- Subtitle / Meta Description Line -->
    <text x="0" y="94" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Platforms, Audio Fingerprinting, Content ID &amp; Open-Source Rights Management
    </text>

    <!-- Feature Highlights / Mini Pillars -->
    <g transform="translate(0, 118)">
      <!-- Item 1 -->
      <circle cx="5" cy="6" r="3.5" fill="#00f2fe" />
      <text x="15" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Music Licensing</text>

      <!-- Item 2 -->
      <circle cx="140" cy="6" r="3.5" fill="#38ef7d" />
      <text x="150" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Acoustic Fingerprinting</text>

      <!-- Item 3 -->
      <circle cx="325" cy="6" r="3.5" fill="#a855f7" />
      <text x="335" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">AI Watermarking</text>

      <!-- Item 4 -->
      <circle cx="475" cy="6" r="3.5" fill="#e94057" />
      <text x="485" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">License Compliance</text>

      <!-- Item 5 -->
      <circle cx="645" cy="6" r="3.5" fill="#fbb034" />
      <text x="655" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Royalty Automation</text>
    </g>
  </g>

  <!-- Border Gradient Stroke for Outer Card -->
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="url(#accent-cyan)" stroke-width="1.5" opacity="0.3" />
</svg>
